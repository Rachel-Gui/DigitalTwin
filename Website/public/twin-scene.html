<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>South Park 3D scene</title>
<link id="arcgis-theme" rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<style>html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f5}#message{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;padding:32px;font:13px/1.7 Arial,sans-serif;background:inherit;color:#66777a;z-index:2}#message[hidden]{display:none}.esri-ui-top-left{top:70px!important;left:var(--scene-tools-left,336px)!important}.esri-ui-top-right{top:72px!important;right:var(--scene-tools-right,312px)!important}.esri-popup{--esri-popup-max-width:320px}@media(max-width:900px){.esri-ui-top-left{left:280px!important}.esri-ui-top-right{right:var(--scene-tools-right,16px)!important}}@media(max-width:600px){.esri-ui-top-left{left:12px!important;top:215px!important}.esri-ui-top-right{right:12px!important;top:215px!important}}
.esri-widget{border-radius:10px;overflow:hidden;box-shadow:0 3px 16px #17333d12}.esri-widget--button{border-radius:10px;box-shadow:none}.esri-ui-corner .esri-component{border:1px solid #dce4e5}.calcite-mode-dark .esri-ui-corner .esri-component{border-color:#34474c}
@media(max-width:1100px) and (min-width:901px){.esri-ui-top-left{left:312px!important}.esri-ui-top-right{right:290px!important}}@media(max-width:600px){.esri-ui-top-left{top:auto!important;bottom:52px!important;left:12px!important}.esri-ui-top-right{top:285px!important;right:12px!important}}
</style>
</head><body><div id="scene" aria-label="South Park interactive 3D scene"></div><div id="message" role="status">Loading South Park 3D scene…</div>

<script defer src="/twin-scene.js"></script>
</body></html>
